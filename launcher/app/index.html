<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>

<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>

<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17h12l-2-3V9a4 4 0 0 0-8 0v5Zm4 3h4M12 3v2"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5ZM20 2v4m-2-2h4"/></symbol>

<div class="app">
 <aside class="sidebar">
  <div class="brand"><img src="assets/launcher-icon.png" alt=""><strong>2027<br>카운트다운</strong></div>
  <nav aria-label="메뉴"><button class="nav-item active" data-page="home" aria-current="page" aria-controls="page-home"><svg aria-hidden="true"><use href="#i-grid"/></svg>플레이</button></nav>
  <div class="sidebar-bottom"><div class="edition"><div class="grass-block" aria-hidden="true"></div><div><b>Minecraft</b><span>Java Edition</span></div></div>
   <button class="nav-item" data-page="settings" aria-controls="page-settings"><svg aria-hidden="true"><use href="#i-settings"/></svg>설정</button>
  </div>
 </aside>
 <main>
  <header class="topbar"><div class="title-drag"></div>
   <button class="account-button" id="accountButton"><span class="avatar" id="avatar"><svg><use href="#i-user"/></svg></span><span><b id="accountName">Microsoft 계정</b><small id="accountHint">로그인</small></span><svg class="chevron"><use href="#i-chevron"/></svg></button>
   <div class="window-controls"><button data-window="minimize" aria-label="최소화">−</button><button data-window="maximize" aria-label="최대화">□</button><button data-window="close" aria-label="닫기">×</button></div>
  </header>
  <section class="page visible" id="page-home">
   <div class="hero"><img class="hero-scene" src="assets/mc.png" alt="오로라 아래 눈 덮인 마인크래프트 마을과 크리스마스 트리" width="2172" height="724" fetchpriority="high">
    <div class="hero-shade" aria-hidden="true"></div><div class="fireworks" aria-hidden="true"><i></i><i></i><i></i></div><div class="snow" aria-hidden="true"><i></i><i></i></div>
    <div class="hero-copy"><img class="year" src="assets/year.svg" alt="2027" width="480" height="174"><span class="splash" id="splash" aria-hidden="true"></span></div>
    <div class="play-dock">
     <div class="dock-middle" id="dockStatus" hidden><div class="status-line" role="status"><i id="statusDot" aria-hidden="true"></i><span id="statusText">대기 중</span></div><div class="progress-track" role="progressbar" aria-label="게임 준비" aria-valuemin="0" aria-valuemax="100" hidden><i id="progressBar"></i></div><small id="progressDetail"></small></div>
     <div class="dock-main"><b class="countdown-label">2027년까지</b><div class="countdown" aria-label="2027년 카운트다운"><div><span class="px" id="px-days" aria-hidden="true"></span><b class="sr" id="cd-days">00</b><span>일</span></div><i>:</i><div><span class="px" id="px-hours" aria-hidden="true"></span><b class="sr" id="cd-hours">00</b><span>시간</span></div><i>:</i><div><span class="px" id="px-minutes" aria-hidden="true"></span><b class="sr" id="cd-minutes">00</b><span>분</span></div><i>:</i><div><span class="px" id="px-seconds" aria-hidden="true"></span><b class="sr" id="cd-seconds">00</b><span>초</span></div></div><button class="cancel-button" id="cancelButton" hidden>취소</button><button class="play-button" id="playButton"><svg aria-hidden="true"><use href="#i-play"/></svg><span id="playLabel">플레이</span></button></div>
    </div>
   </div>
  </section>
  <section class="page" id="page-settings"><div class="section-head"><h1>설정</h1><span class="save-status" id="saveStatus" role="status"></span></div>
   <form id="settingsForm" class="panel settings-panel"><label for="memoryInput">메모리 할당</label><p class="settings-hint" id="memoryHint">Minecraft에서 사용할 메모리 · 다음 실행부터 적용</p><select name="memoryMb" id="memoryInput" aria-describedby="memoryHint"><option value="2048">2 GB</option><option value="3072">3 GB</option><option value="4096">4 GB</option><option value="6144">6 GB</option><option value="8192">8 GB</option><option value="12288">12 GB</option><option value="16384">16 GB</option></select><div class="form-footer"><button type="submit" class="primary-small">저장</button></div></form>
  </section>
  <section class="auth-overlay" id="authOverlay" hidden aria-label="Microsoft 로그인"><div class="auth-header"><span class="ms-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>Microsoft 로그인</b><button id="authCancel" class="small-button">취소</button></div><div class="auth-code-row"><span>인증 코드</span><b id="authCode"></b><button id="authCopy" class="code-copy">복사</button></div><div class="auth-surface" id="authSurface"><span>로그인 화면을 여는 중</span></div><div class="auth-footer"><span id="authOrigin"></span></div></section>
 </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="infoDialog" aria-labelledby="dialogTitle" aria-describedby="dialogBody"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><div class="dialog-actions"><button class="small-button" id="dialogClose">닫기</button><button class="primary-small" id="dialogAction"></button></div></dialog>
<script src="renderer.js"></script>
</body></html>
